<link rel="stylesheet" href="styles.css" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "name": "Kees Leemeijer",
      "url": "https://verticokees.github.io/Bird-portfolio/",
      "image": "https://verticokees.github.io/Bird-portfolio/files/P5-Green_Bee-eater.webp",
      "jobTitle": "Bird photographer",
      "email": "mailto:kees_leemeijer@hotmail.com"
    },
    {
      "@type": "ImageGallery",
      "name": "Bird Photography by Kees Leemeijer",
      "url": "https://verticokees.github.io/Bird-portfolio/",
      "creator": { "@type": "Person", "name": "Kees Leemeijer" },
      "image": [
        {"@type":"ImageObject","name":"European Robin","contentUrl":"https://verticokees.github.io/Bird-portfolio/files/P1-European_Robin.webp"},
        {"@type":"ImageObject","name":"Weaver Bird","contentUrl":"https://verticokees.github.io/Bird-portfolio/files/P2-Weaver_Bird.webp"},
        {"@type":"ImageObject","name":"Eurasian Jay","contentUrl":"https://verticokees.github.io/Bird-portfolio/files/P3-Eurasian_Jay.webp"},
        {"@type":"ImageObject","name":"Dunnock","contentUrl":"https://verticokees.github.io/Bird-portfolio/files/P4-Dunnock.webp"},
        {"@type":"ImageObject","name":"Green Bee-eater","contentUrl":"https://verticokees.github.io/Bird-portfolio/files/P5-Green_Bee-eater.webp"},
        {"@type":"ImageObject","name":"Weaver Bird","contentUrl":"https://verticokees.github.io/Bird-portfolio/files/P6-Weaver_Bird_flapping.webp"},
        {"@type":"ImageObject","name":"Great Tit","contentUrl":"https://verticokees.github.io/Bird-portfolio/files/P7-Great_Tit.webp"},
        {"@type":"ImageObject","name":"Lark","contentUrl":"https://verticokees.github.io/Bird-portfolio/files/P8-Lark.webp"}
      ]
    }
  ]
}
</script>
</head>
<body>
<main>

  <!-- Spatial plane — single experience for every viewport -->
  <div class="stage" id="stage" role="application" aria-label="Pannable photograph plane. Drag, pinch, or use arrow keys to explore.">
    <div class="plane" id="plane"></div>
  </div>

  <!-- Identity (wordmark + pictogram) -->
  <a class="identity" href="mailto:kees_leemeijer@hotmail.com" aria-label="Email Kees Leemeijer">
    <img class="pictogram" src="files/logo/SVG/logo.svg" alt="" aria-hidden="true" />
    <h1 class="wordmark"><span class="name">Kees Leemeijer</span><span class="dot">.</span></h1>
  </a>

  <!-- Species label, pinned bottom-left.
       Resting: just .line-name in small caps on the photo.
       Bloomed: name + latin, hairline-separated lede / vitals / fun-fact pull. -->
  <div class="species" id="species">
    <div class="line-name" aria-live="polite" aria-atomic="true"></div>
    <div class="line-lede"></div>
    <div class="line-vitals"></div>
    <div class="line-fact"></div>
    <div class="meta"></div>
  </div>

  <!-- Quiet pan affordance: arrangement letter + drag hint -->
  <div class="compass">
    <div>Drag · pinch · arrow keys</div>
    <div>Arrangement <span class="arr" id="compass-arr">A</span></div>
  </div>

</main>
<script src="app.js"></script>
</body>
</html>
